name: Check TOOLS.md

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Run the generator tests
        run: node --test scripts/*.test.mjs
      - name: Rebuild TOOLS.md from data/tools.json
        run: |
          date=$(sed -n 's/^Last updated: \([0-9-]*\).*/\1/p' TOOLS.md | head -n 1)
          if [ -z "$date" ]; then
            echo "::error file=TOOLS.md::No 'Last updated:' line found in TOOLS.md."
            exit 1
          fi
          node scripts/build-tools-md.mjs --date "$date"
      - name: Fail if TOOLS.md is out of date
        run: |
          if ! git diff --exit-code -- TOOLS.md data/tools.json; then
            echo "::error file=TOOLS.md::TOOLS.md does not match data/tools.json and the generator. Run: node scripts/build-tools-md.mjs --in <tools export> --data data/tools.json --out TOOLS.md, then commit both files."
            exit 1
          fi
